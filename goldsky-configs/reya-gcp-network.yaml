      - name: reya-network-latest
        version: v1
    name: market_updated
    start_at: latest
  deposited:
    type: subgraph_entity
    subgraphs:
      - name: reya-network-latest
        version: v1
    name: deposited
    start_at: latest
  withdrawn:
    type: subgraph_entity
    subgraphs:
      - name: reya-network-latest
        version: v1
    name: withdrawn
    start_at: latest
  share_balance_updated:
    type: subgraph_entity
    subgraphs:
      - name: reya-network-latest
        version: v1
    name: share_balance_updated
    start_at: latest
  passive_perp_match_order:
    type: subgraph_entity
    subgraphs:
      - name: reya-network-latest
        version: v1
