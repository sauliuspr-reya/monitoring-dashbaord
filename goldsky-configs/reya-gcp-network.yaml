    subgraphs:
      - name: reya-network-latest
        version: v1
    name: market_configuration_updated
    start_at: latest
  tier_fee_updated:
    type: subgraph_entity
    subgraphs:
      - name: reya-network-latest
        version: v1
    name: tier_fee_updated
    start_at: latest
  account_tier_updated:
    type: subgraph_entity
    subgraphs:
      - name: reya-network-latest
        version: v1
    name: account_tier_updated
    start_at: latest
  collateral_configuration:
