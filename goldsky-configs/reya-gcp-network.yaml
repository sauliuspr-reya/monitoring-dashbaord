    start_at: latest
  auto_exchange_triggered:
    type: subgraph_entity
    subgraphs:
      - name: reya-network-latest
        version: v1
    name: auto_exchange_triggered
    start_at: latest
  auto_exchange_configuration_updated:
    type: subgraph_entity
    subgraphs:
      - name: reya-network-latest
        version: v1
