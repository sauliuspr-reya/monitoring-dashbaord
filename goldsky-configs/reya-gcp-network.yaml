    type: subgraph_entity
    subgraphs:
      - name: reya-network-latest
        version: v1
    name: pool_created
    start_at: latest
  account_signature_nonce_incremented:
    type: subgraph_entity
    subgraphs:
      - name: reya-network-latest
        version: v1
    name: account_signature_nonce_incremented
